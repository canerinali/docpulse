name: ci

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repository; nothing here needs a writable token.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Repeated at job level: a workflow-level block is inherited, but a job that
    # declares its own is the one thing a later edit cannot quietly widen.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail the build on a known-vulnerable dependency rather than finding out
      # from a user. Dependabot (.github/dependabot.yml) opens the PRs.
      - run: npm audit --audit-level=high

      # tsc --noEmit + vitest run. No database service: the live integration
      # test skips itself when MONGODB_URI is unset.
      - run: npm run check

      - run: npm run build

      - name: The example must keep working end to end
        run: ./examples/run.sh
