name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc --noEmit + vitest run. No database service: the live integration
      # test skips itself when MONGODB_URI is unset.
      - run: npm run check

      - run: npm run build

      - name: The example must keep working end to end
        run: ./examples/run.sh
